<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JadwalKu</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="card">
        <h2>JadwalKu ⏰📅</h2>
        
        <!-- Bagian Input Data + Waktu Alarm -->
        <div class="input-section">
            <input type="text" id="taskInput" placeholder="Contoh: Latihan Eskul / Rapat OSIS...">
            <div style="display: flex; gap: 10px;">
                <select id="categoryInput" style="flex: 1;">
                    <option value="Sekolah/Kuliah">Sekolah/Kuliah</option>
                    <option value="Kerja">Kerja</option>
                    <option value="Pribadi">Pribadi</option>
                </select>
                <!-- Input Jam untuk Alarm -->
                <input type="time" id="timeInput" style="flex: 1;">
            </div>
            <button onclick="tambahJadwal()">Tambah Jadwal & Alarm</button>
        </div>

        <!-- Bagian Daftar Tampil Jadwal -->
        <div class="list-container">
            <ul id="taskList">
                <!-- Data jadwal akan masuk otomatis ke sini -->
            </ul>
        </div>
    </div>

    <script>
        document.addEventListener("DOMContentLoaded", muatJadwal);

        function tambahJadwal() {
            const taskInput = document.getElementById('taskInput');
            const categoryInput = document.getElementById('categoryInput');
            const timeInput = document.getElementById('timeInput');

            const namaKegiatan = taskInput.value.trim();
            const kategori = categoryInput.value;
            const waktuAlarm = timeInput.value;

            if (namaKegiatan === "") {
                alert("Nama kegiatan tidak boleh kosong!");
                return;
            }

            if (waktuAlarm === "") {
                alert("Tolong tentukan jam alarmnya ya!");
                return;
            }

            const taskData = {
                id: Date.now(),
                nama: namaKegiatan,
                kategori: kategori,
                waktu: waktuAlarm,
                sudahBunyi: false
            };

            simpanKeLocalStorage(taskData);
            tampilkanJadwal();

            taskInput.value = "";
            timeInput.value = "";
        }

        function tampilkanJadwal() {
            const taskList = document.getElementById('taskList');
            taskList.innerHTML = "";

            let tasks = JSON.parse(localStorage.getItem('jadwalKuData')) || [];

            tasks.forEach((task) => {
                const li = document.createElement('li');
                li.innerHTML = `
                    <div>
                        <span class="task-info">${task.kategori}</span>
                        <span style="font-size: 12px; background: #ffeaa7; padding: 3px 6px; border-radius: 4px; color: #d63031; font-weight: bold; margin-right: 6px;">🔔 ${task.waktu}</span>
                        <strong>${task.nama}</strong>
                    </div>
                    <button class="delete-btn" onclick="hapusJadwal(${task.id})">Hapus</button>
                `;
                taskList.appendChild(li);
            });
        }

        function simpanKeLocalStorage(task) {
            let tasks = JSON.parse(localStorage.getItem('jadwalKuData')) || [];
            tasks.push(task);
            localStorage.setItem('jadwalKuData', JSON.stringify(tasks));
        }

        function hapusJadwal(id) {
            let tasks = JSON.parse(localStorage.getItem('jadwalKuData')) || [];
            tasks = tasks.filter(task => task.id !== id);
            localStorage.setItem('jadwalKuData', JSON.stringify(tasks));
            tampilkanJadwal();
        }

        function muatJadwal() {
            tampilkanJadwal();
        }

        // --- SISTEM ALARM DENGAN SUARA BRAWAI / BEEP (WEB AUDIO API) ---
        function bunyiBeep() {
            try {
                const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
                const oscillator = audioCtx.createOscillator();
                const gainNode = audioCtx.createGain();

                oscillator.type = 'sine';
                oscillator.frequency.setValueAtTime(880, audioCtx.currentTime); // Nada dering
                oscillator.connect(gainNode);
                gainNode.connect(audioCtx.destination);

                oscillator.start();
                oscillator.stop(audioCtx.currentTime + 0.8); // Bunyi selama 0.8 detik
            } catch (e) {
                console.log("Audio didukung");
            }
        }

        setInterval(() => {
            let tasks = JSON.parse(localStorage.getItem('jadwalKuData')) || [];
            let sekarang = new Date();
            let jamSekarang = String(sekarang.getHours()).padStart(2, '0') + ":" + String(sekarang.getMinutes()).padStart(2, '0');

            let adaPerubahan = false;

            tasks.forEach(task => {
                if (task.waktu === jamSekarang && !task.sudahBunyi) {
                    bunyiBeep(); // Memanggil suara alarm otomatis
                    alert(`⏰ WAKTUNYA KEGIATAN!\n\nKegiatan: "${task.nama}" (${task.kategori}) sudah dimulai!`);
                    task.sudahBunyi = true;
                    adaPerubahan = true;
                }
            });

            if (adaPerubahan) {
                localStorage.setItem('jadwalKuData', JSON.stringify(tasks));
            }
        }, 1000);
    </script>
</body>
</html>
